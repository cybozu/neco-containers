apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: default
  name: pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    namespace: default
    name: pilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pilot
  template:
    metadata:
      labels:
        app: pilot
    spec:
      serviceAccountName: pilot
      containers:
        - name: ubuntu
          args:
            - pause
          image: ghcr.io/cybozu/ubuntu-debug:24.04@sha256:58983a5acdb7eb6e4b1e15f7fe3074b9f7ec8c3137b8c2b0ca7b65a3e3488bf8
