# The route collector runs in its own DaemonSet because it needs the host network namespace.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: neco-exporter
  name: neco-node-route-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: neco-node-route-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neco-node-route-exporter
    spec:
      hostNetwork: true
      containers:
        - image: ghcr.io/cybozu/neco-exporter:dev
          name: exporter
          args:
            - --scope=node
            - --collectors=route
            - --port=8090
            - --interval=10s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            capabilities:
              drop:
                - ALL
      tolerations:
        - operator: Exists
