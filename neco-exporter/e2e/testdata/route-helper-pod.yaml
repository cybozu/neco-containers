# Adds and deletes routes in the host network namespace for the route collector test.
apiVersion: v1
kind: Pod
metadata:
  namespace: neco-exporter
  name: route-helper
spec:
  hostNetwork: true
  containers:
    - name: main
      args:
        - pause
      image: ghcr.io/cybozu/ubuntu-debug:24.04@sha256:58983a5acdb7eb6e4b1e15f7fe3074b9f7ec8c3137b8c2b0ca7b65a3e3488bf8
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
  tolerations:
    - operator: Exists
