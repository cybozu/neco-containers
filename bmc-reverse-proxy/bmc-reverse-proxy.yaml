apiVersion: v1
kind: Service
metadata:
  name: bmc-reverse-proxy
  labels:
    app.kubernetes.io/name: bmc-reverse-proxy
  annotations:
    metallb.universe.tf/address-pool: internet
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: web
      port: 443
      protocol: TCP
      targetPort: 8443
    - name: virtual-console
      port: 5900
      protocol: TCP
      targetPort: 5900
  selector:
    app.kubernetes.io/name: bmc-reverse-proxy
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bmc-reverse-proxy-tls
spec:
  secretName: bmc-reverse-proxy-tls
  issuerRef:
    kind: ClusterIssuer
    name: clouddns
  # replace with the actual domain for BMCs
  commonName: "*.bmc.example.com"
  dnsNames:
    - "*.bmc.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmc-reverse-proxy
  labels:
    app.kubernetes.io/name: bmc-reverse-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bmc-reverse-proxy
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bmc-reverse-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread the replicas across nodes. With externalTrafficPolicy: Local,
      # only the nodes running the Pods receive traffic.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bmc-reverse-proxy
      # Allow active requests such as uploading firmware images to finish on shutdown.
      terminationGracePeriodSeconds: 120
      initContainers:
        # Native sidecar (Kubernetes 1.29+): starts before and stops after bmc-reverse-proxy.
        - name: update-resolve-map
          image: ghcr.io/cybozu/bmc-reverse-proxy:0.2.0
          restartPolicy: Always
          command: ["/update-resolve-map"]
          args:
            - -sabakan-address=<SABAKAN_ADDRESS>:10080  # replace with the sabakan address and its GraphQL port
          volumeMounts:
            - name: resolve-map
              mountPath: /var/lib/resolve-map
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bmc-reverse-proxy
          image: ghcr.io/cybozu/bmc-reverse-proxy:0.2.0
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: resolve-map
              mountPath: /var/lib/resolve-map
              readOnly: true
          ports:
            - name: web
              containerPort: 8443
              protocol: TCP
            - name: virtual-console
              containerPort: 5900
              protocol: TCP
            - name: probe
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
          lifecycle:
            # Wait for the Pod to be removed from the endpoints of the Service
            # before closing the listeners (Kubernetes 1.30+).
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: bmc-reverse-proxy-tls
        - name: resolve-map
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bmc-reverse-proxy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bmc-reverse-proxy
