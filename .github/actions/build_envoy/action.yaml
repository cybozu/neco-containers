name: "Build Envoy"
description: "Build Envoy"
inputs:
  envoy_commit_sha:
    description: "envoy commit sha"
    required: true
  push:
    description: >-
      whether to push the built image (caller-controlled; 'true' to push).
      Note that the image will NOT be pushed if the tag has already existed 
      on the registry, even if this field is set to 'true'.
    required: true
  takumi-guard-bot-id:
    description: "Takumi Guard bot ID"
    required: true

outputs:
  image:
    description: "Built image name"
    value: ${{ steps.prepare.outputs.image }}
  tag:
    description: "Built image tag"
    value: ${{ steps.prepare.outputs.tag }}
  image-identifier:
    description: "Built image identifier"
    value: ${{ steps.prepare.outputs.image-identifier }}
  changed: 
    description: >-
      whether the image has been built and pushed (true) or not (false).
    value: ${{ steps.prepare.outputs.build }}

runs:
  using: "composite"
  steps:
    - name: Prepare
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PLAN=$(./build_decision ".github/actions/build_envoy/target.yaml" "envoy" "envoy")
        echo "plan=${PLAN}" >> "$GITHUB_OUTPUT"
        echo "build=$(echo "${PLAN}" | jq -r '.build')" >> "$GITHUB_OUTPUT"
        echo "image=$(echo "${PLAN}" | jq -r '.scan.image')" >> "$GITHUB_OUTPUT"
        echo "tag=$(echo "${PLAN}" | jq -r '.scan.tag')" >> "$GITHUB_OUTPUT"
        echo "image-identifier=$(echo "${PLAN}" | jq -r '.scan.identifier')" >> "$GITHUB_OUTPUT"
    - name: Setup build environment
      uses: ./.github/actions/setup
      with:
        platforms: "linux/amd64"
        go-version-file: "./envoy/go.mod"
        takumi-guard-bot-id: ${{ inputs.takumi-guard-bot-id }}
    - name: Prepare VERSION
      shell: bash
      run: |
        TAG=$(cat ./envoy/TAG)
        VERSION=$(echo $TAG | cut -d \. -f 1,2,3)
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
    - name: Test
      if: steps.prepare.outputs.build == 'true'
      shell: bash
      working-directory: envoy
      run: make test
    - name: Build
      if: steps.prepare.outputs.build == 'true'
      shell: bash
      working-directory: envoy
      run: |
        # Instruction: Building Envoy with Bazel
        # https://github.com/envoyproxy/envoy/blob/main/bazel/README.md
        #
        # Default runner includes bazelisk by default.
        # Appropriate bazel version is decided from `.bazelversion`.
        # https://github.com/bazelbuild/setup-bazelisk
        # https://github.com/envoyproxy/envoy/blob/main/.bazelversion
        mkdir -p src
        cd src
        
        # Install Build dependencies
        # Envoy v1.38 uses the hermetic LLVM 18.1.8 toolchain (bazel/toolchains.bzl),
        # which is the upstream release built for ubuntu 18.04 and requires libtinfo.so.5.
        # The runner (ubuntu 24.04) no longer provides the libtinfo5 package, so install
        # the Debian package the same way as the upstream build image does.
        # https://github.com/llvm/llvm-project/issues/75490
        # https://github.com/envoyproxy/toolshed/blob/7e0344e0ddd6ee5e56105172f7dd17346049c0df/docker/build/linux/debian/fun.sh
        # Upstream main has moved to LLVM 22.1.8 built by envoy_toolshed (MODULE.bazel).
        # When updating envoy, check whether this workaround is still needed.
        LIBTINFO5_DEB=libtinfo5_6.4-4_amd64.deb
        curl -fsSLO "http://deb.debian.org/debian/pool/main/n/ncurses/${LIBTINFO5_DEB}"
        echo "dd347f794e651039e7b4c391f86c674fed7f415b3dca6b0937beb0d470f09c1a  ${LIBTINFO5_DEB}" | sha256sum --check
        sudo dpkg -i "${LIBTINFO5_DEB}"
        rm "${LIBTINFO5_DEB}"

        # Clone Envoy repository
        git init envoy; cd envoy;
        git remote add origin https://github.com/envoyproxy/envoy
        git fetch --depth 1 origin "refs/tags/v${{ env.VERSION }}"
        test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "${{ inputs.envoy_commit_sha }}";
        git checkout --detach "${{ inputs.envoy_commit_sha }}"
        git log -n1 --oneline

        echo "build --config=clang" >> user.bazelrc
        # https://github.com/cybozu/neco-containers/pull/1119
        sed -i s/envoy_dependencies_extra\(\)/envoy_dependencies_extra\(ignore_root_user_error=True\)/ WORKSPACE

        # Check Bazel version
        # e.g. bazel x.y.z
        if [ "$(bazel --version | cut -d' ' -f2)" != "$(cat .bazelversion)" ]; then
            echo "Wrong bazel version detected"
            exit 1
        fi

        # Compile Envoy
        # https://github.com/envoyproxy/envoy/blob/main/bazel/README.md#release-builds
        bazel --bazelrc=/dev/null build --jobs=auto -c opt --config=clang //source/exe:envoy-static.stripped
    - name: Move files
      if: steps.prepare.outputs.build == 'true'
      shell: bash
      working-directory: envoy
      run: |
        mkdir -p workspace
        mv src/envoy/bazel-bin/source/exe/envoy-static.stripped workspace/envoy
        mv src/envoy/LICENSE workspace/
    - name: Build and push
      if: steps.prepare.outputs.build == 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: envoy
        platforms: "linux/amd64"
        push: ${{ inputs.push == 'true' }}
        tags: ${{ join(fromJSON(steps.prepare.outputs.plan).tags, ',') }}
        load: true
    - name: Test image
      if: steps.prepare.outputs.build == 'true'
      shell: bash
      env:
        IMAGE: ${{ fromJSON(steps.prepare.outputs.plan).tags[0] }}
      run: docker run --rm --pull=never "$IMAGE" --version
