name: check-codeowners

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure every non-hidden top-level directory has a CODEOWNERS entry
        run: |
          set -euo pipefail
          missing=()
          for d in */; do
            name="${d%/}"
            if ! grep -qE "^/${name}/" .github/CODEOWNERS; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "::error::The following top-level directories are missing from .github/CODEOWNERS:"
              printf ' - %s\n' "${missing[@]}"
              echo
              echo "Add an owner entry, e.g.:"
              echo "  /<dir>/  @cybozu-private/<team>"
            } >&2
            exit 1
          fi
