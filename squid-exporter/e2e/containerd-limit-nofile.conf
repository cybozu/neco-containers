# kind's node image runs containerd with LimitNOFILE=infinity, which
# systemd resolves to the host's fs.nr_open. On hosts where systemd has
# bumped fs.nr_open to its maximum (~2^31), every pod inherits that huge
# RLIMIT_NOFILE and squid hangs trying to allocate fd tables for it.
# Pin the same value that Neco production uses for k8s-containerd.service.
[Service]
LimitNOFILE=1048576
