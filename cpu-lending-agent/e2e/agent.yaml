apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpu-lending-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpu-lending-agent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cpu-lending-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cpu-lending-agent
subjects:
- kind: ServiceAccount
  name: cpu-lending-agent
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cpu-lending-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-lending-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-lending-agent
    spec:
      serviceAccountName: cpu-lending-agent
      priorityClassName: system-node-critical
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
      containers:
      - name: agent
        image: ghcr.io/cybozu/cpu-lending-agent:dev
        imagePullPolicy: Never
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: nri-sock
          mountPath: /var/run/nri
        - name: kubelet-dir
          mountPath: /var/lib/kubelet
          readOnly: true
        - name: cache-dir
          mountPath: /var/lib/cpu-lending-agent
      volumes:
      - name: nri-sock
        hostPath:
          path: /var/run/nri
          type: Directory
      - name: kubelet-dir
        hostPath:
          path: /var/lib/kubelet
          type: Directory
      - name: cache-dir
        hostPath:
          path: /var/lib/cpu-lending-agent
          type: DirectoryOrCreate
