version: "2"
linters:
  default: standard
  enable:
    - depguard
    - ginkgolinter
    - nilerr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    depguard:
      rules:
        restricted-packages:
          files:
            - $all
          deny:
            - pkg: html/template$
              desc: html/template must not be used
            - pkg: log$
              desc: log must not be used
    errcheck:
      exclude-functions:
        - github.com/cybozu-go/log.Error
    staticcheck:
      checks:
        - all
        # disable check of use of deprecated features; we still need to generate Endpoints objects
        - -SA1019
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
  settings:
    goimports:
      local-prefixes:
        - github.com/cybozu/neco-containers/machines-endpoints
